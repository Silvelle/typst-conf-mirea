<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Typst configuration flow</title>
  <desc id="desc">A report imports report.typ, the conf function applies shared settings, and Typst produces a styled PDF.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="260" rx="18" fill="#f8fafc"/>
  <g font-family="Liberation Sans, Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <rect x="35" y="70" width="220" height="120" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="145" y="120" font-size="28" font-weight="700">main.typ</text>
    <text x="145" y="158" font-size="20">Report content</text>

    <rect x="370" y="70" width="220" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="480" y="114" font-size="26" font-weight="700">report.typ</text>
    <text x="480" y="148" font-size="20">conf + helpers</text>
    <text x="480" y="175" font-size="18">Shared styles</text>

    <rect x="705" y="70" width="220" height="120" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="815" y="120" font-size="28" font-weight="700">report.pdf</text>
    <text x="815" y="158" font-size="20">Styled output</text>
  </g>
  <path d="M260 130 H350" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M595 130 H685" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="305" y="108" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#334155" text-anchor="middle">imports</text>
  <text x="640" y="108" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#334155" text-anchor="middle">compile</text>
</svg>
